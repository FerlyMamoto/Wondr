<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNI DigiCS - Panduan Interaktif</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="home-body">

    <!-- HEADER LOGOS -->
    <header class="home-header">
        <!-- Pastikan file logo tersedia di folder assets/images/ -->
        <img src="assets/images/logo-bni.png" alt="Logo BNI" class="logo-bni">
        <img src="assets/images/logo-wondr.png" alt="Logo wondr" class="logo-wondr">
    </header>

    <!-- MAIN CONTENT -->
    <main class="home-main">
        <div class="home-titles animate-fade-up">
            <h1>Panduan Interaktif Wondr by BNI</h1>
            <h2>Pilih Panduan</h2>
            <p>Silakan pilih panduan yang ingin Anda inginkan.</p>
        </div>

        <div class="home-menus animate-fade-up" style="animation-delay: 0.2s;">
            
            <!-- MENU 1 -->
            <a href="pembukaan-rekening.html" class="menu-card">
                <span>Buka Rekening Baru</span>
                <i class="fa-solid fa-arrow-right text-accent"></i>
            </a>

            <!-- VIDEO TUTORIAL BUKA REKENING -->
            <div class="tutorial-video animate-fade-up" style="animation-delay: 0.3s;">
                <iframe
                    src="https://www.youtube.com/embed/oOp-Et6xUGY"
                    title="Video Tutorial Buka Rekening Baru"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <!-- MENU 2 -->
            <!-- Sebagai contoh, jika nanti ada menu Pengambilan Kartu, bisa dicopy format ini -->
            <!-- <a href="#" class="menu-card">
                <span>Pengambilan Kartu</span>
                <i class="fa-solid fa-arrow-right text-accent"></i>
            </a> -->

            <!-- MENU 3 -->
            <a href="reset-pin.html" class="menu-card">
                <span>Reset Pin Kartu Debit</span>
                <i class="fa-solid fa-arrow-right text-accent"></i>
            </a>

            <!-- VIDEO TUTORIAL RESET PIN -->
            <div class="tutorial-video animate-fade-up" style="animation-delay: 0.4s;">
                <video
                    controls
                    width="100%"
                    style="display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain;"
                    preload="metadata">
                    <source src="assets/images/Video Tutorial.mp4" type="video/mp4">
                    Browser Anda tidak mendukung pemutaran video.
                </video>
            </div>

        </div>
    </main>

    <!-- FOOTER LOGO UNSRAT -->
    <footer class="home-footer animate-fade-up" style="animation-delay: 0.4s;">
        <!-- Pastikan file logo unsrat tersedia -->
        <img src="assets/images/logo-unsrat.png" alt="Lambang Unsrat" class="logo-unsrat">
    </footer>

    <script src="script.js"></script>
</body>
</html>
